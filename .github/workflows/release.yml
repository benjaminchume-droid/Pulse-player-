name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix'
        required: true
        default: '1.0.4'

jobs:
  build_and_release:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION_NAME}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG_NAME#v}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Decode keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "::error::SIGNING_KEY_STORE_BASE64 missing"
            exit 1
          fi
          mkdir -p android/app/keystores
          echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > android/app/keystores/release-key.jks

      - name: Assemble release
        working-directory: android
        env:
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          SHAZAM_DEVELOPER_TOKEN: ${{ secrets.SHAZAM_DEVELOPER_TOKEN }}
        run: |
          gradle assembleRelease \
            -PversionCode="${{ steps.ver.outputs.build_number }}" \
            -PversionName="${{ steps.ver.outputs.version_name }}" \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-v${{ steps.ver.outputs.version_name }}
          path: android/app/build/outputs/apk/release/*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: Pulse Player v${{ steps.ver.outputs.version_name }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
