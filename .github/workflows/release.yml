name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 1.0.2)'
        required: true
        default: '1.0.2'

jobs:
  build_and_release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION_NAME}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG_NAME#v}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Decode keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "::error::SIGNING_KEY_STORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p android/app/keystores
          echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > android/app/keystores/release-key.jks
          ls -la android/app/keystores/release-key.jks

      - name: Build signed release
        env:
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
        working-directory: android
        run: |
          gradle assembleRelease bundleRelease \
            -PversionCode="${{ steps.ver.outputs.build_number }}" \
            -PversionName="${{ steps.ver.outputs.version_name }}" \
            --no-daemon --stacktrace
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Changelog
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag_name }}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log "${PREV}..HEAD" --oneline --pretty=format:'- %s' | head -40)
          else
            CHANGES=$(git log --oneline --max-count=20 --pretty=format:'- %s')
          fi
          {
            echo "body<<EOF"
            echo "### Pulse Player v${{ steps.ver.outputs.version_name }}"
            echo ""
            echo "**Velocity Lab** · Built by **Glass Line**"
            echo ""
            echo "#### Changelog"
            echo "$CHANGES"
            echo ""
            echo "#### Artifacts"
            echo "- app-release.apk — sideload"
            echo "- app-release.aab — Play Store"
            echo ""
            echo "License: MIT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-v${{ steps.ver.outputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: Pulse Player v${{ steps.ver.outputs.version_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
