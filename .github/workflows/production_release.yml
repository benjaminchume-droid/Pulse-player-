name: Production Release

on:
  push:
    tags:
      - 'v*' # Trigger build on any release tags matching v1.0.0, v2.1.0-beta, etc.

jobs:
  production_build_and_release:
    name: Build Signed Binaries & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission required to write and publish GitHub Releases

    steps:
      # 1. Checkout codebase at exact commit
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to generate dynamic changelogs

      # 2. Extract Version Metadata from SemVer Git Tag
      - name: Extract Release Tag Version Method
        id: pre_version
        run: |
          # Strip the 'v' prefix if it exists to get absolute version name
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          # Use run number as sequential build number reference
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

      # 3. Setup Java environment
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Integrate Flutter and setup automatic build-cache
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      # 5. Fetch dependencies safely
      - name: Install Dependencies
        run: flutter pub get

      # 6. Rigorously run static checks to guarantee release quality
      - name: Run Quality Verification
        run: |
          flutter analyze
          flutter test

      # 7. Decrypt secure binary properties for App signing (PlayStore compliant)
      # This step translates the base64 keystore secret back into a physical file
      - name: Decrypt Android Keystore File (jks)
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "::warning::SIGNING_KEY_STORE_BASE64 is empty! Skipping key files regeneration. Build will proceed in unsigned status."
          else
            mkdir -p android/app/keystores
            echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > android/app/keystores/release-key.jks
            echo "Keystore credential successfully written to disk."
          fi

      # 8. Setup Gradle Caching mechanism
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 9. Build signed Android App Bundle (.aab) with dynamic release version numbering
      - name: Build Signed App Bundle (AAB)
        env:
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.pre_version.outputs.version_name }}" \
            --build-number="${{ steps.pre_version.outputs.build_number }}"

      # 10. Build signed Android Universal Split APK
      - name: Build Signed Universal APK
        env:
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.pre_version.outputs.version_name }}" \
            --build-number="${{ steps.pre_version.outputs.build_number }}"

      # 11. Extract Release changelogs dynamically comparing with the previous tag tag
      - name: Generate Changelog Highlights
        id: git_changelog
        run: |
          # Extract commit titles since prior tag, falling back to full logs if first release
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..${{ github.ref_name }}" --oneline --pretty=format:"- %s")
          else
            CHANGES=$(git log --oneline --max-count=15 --pretty=format:"- %s")
          fi
          
          # Handle multiline outputs safely for newer GitHub Actions Runner outputs
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 12. Persist signed artifacts safely for distribution verification
      - name: Upload Clean Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-prod-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 13. Publish official release on GitHub with signed bundles attached
      - name: Create Production Release Entry
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Pulse Player v${{ steps.pre_version.outputs.version_name }}"
          body: |
            ### 🎧 Pulse Player App Release Update [v${{ steps.pre_version.outputs.version_name }}]
            
            Welcome to the newest release candidate of Pulse Player built securely in our automated CI/CD loop.
            
            #### 🛠 Release Changelogs
            ${{ steps.git_changelog.outputs.CHANGELOG }}
            
            #### 📦 Release Artifacts
            - **\`app-release.apk\`**: Standalone, optimized release binaries for instant sideloading.
            - **\`app-release.aab\`**: Production Google Play Store App Bundle bundle ready for automated indexing.
            
            -- _Automated via GitHub Actions Pipeline_
          draft: false
          prerelease: false

      # 14. Upload App Bundle (.aab) asset directly to the created GitHub release page
      - name: Upload AAB Asset to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/bundle/release/app-release.aab
          asset_name: pulse-player-v${{ steps.pre_version.outputs.version_name }}.aab
          asset_content_type: application/octet-stream

      # 15. Upload APK (.apk) asset directly to the created GitHub release page
      - name: Upload APK Asset to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: pulse-player-v${{ steps.pre_version.outputs.version_name }}.apk
          asset_content_type: application/vnd.android.package-archive
