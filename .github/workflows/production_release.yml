name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name without v prefix (e.g. 1.0.2)'
        required: true
        default: '1.0.2'

jobs:
  production_build_and_release:
    name: Build Signed Binaries & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Tag Version
        id: pre_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION_NAME}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG_NAME#v}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Decrypt Android Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "::error::SIGNING_KEY_STORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p android/app/keystores
          echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > android/app/keystores/release-key.jks
          ls -la android/app/keystores/release-key.jks

      - name: Build Signed APK & AAB
        env:
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
        run: |
          cd android
          gradle bundleRelease assembleRelease \
            -PversionCode="${{ steps.pre_version.outputs.build_number }}" \
            -PversionName="${{ steps.pre_version.outputs.version_name }}" \
            --no-daemon
          echo "Artifacts:"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Generate Changelog
        id: git_changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ steps.pre_version.outputs.tag_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --oneline --pretty=format:"- %s" | head -40)
          else
            CHANGES=$(git log --oneline --max-count=20 --pretty=format:"- %s")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-v${{ steps.pre_version.outputs.version_name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pre_version.outputs.tag_name }}
          name: "Pulse Player v${{ steps.pre_version.outputs.version_name }}"
          generate_release_notes: true
          body: |
            ### Pulse Player v${{ steps.pre_version.outputs.version_name }}

            **Velocity Lab** · Built by **Glass Line**

            #### Changelog
            ${{ steps.git_changelog.outputs.CHANGELOG }}

            #### Artifacts
            - `app-release.apk` — sideload install
            - `app-release.aab` — Play Store bundle

            License: MIT
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
