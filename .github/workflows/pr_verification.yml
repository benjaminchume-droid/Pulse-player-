name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'android/**'
      - '.github/workflows/pr_verification.yml'

jobs:
  analyze_and_test:
    name: Native Android Code Analysis & Unit Testing
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK compile environment
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Gradle with automatic caching and configuration
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # 4. Run Linting & Static Code Analysis to ensure compliance
      - name: Run Android Lint Check
        run: gradle lintDebug --no-daemon

      # 5. Execute Kotlin/Java Unit Tests with Gradle run
      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      # 6. Verify compilation by building a debug APK
      - name: Build Debug Verification APK
        run: gradle assembleDebug --no-daemon

      # 7. Upload Build reports in case of failures/troubleshooting
      - name: Upload Lint and Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
