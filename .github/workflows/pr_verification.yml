name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'test/**'
      - 'android/**'
      - '.github/workflows/pr_verification.yml'

jobs:
  analyze_and_test:
    name: Code Analysis & Unit Testing
    runs-on: ubuntu-latest

    steps:
      # Checkout current repository revision
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Java JDK required by Gradle and Flutter Android toolchain
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Install and configure Flutter stable environment with caching enabled
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      # Install pubspec dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Run Flutter Static Analyzer to enforce clean architecture and formatting rules
      - name: Run Code Analysis
        run: flutter analyze

      # Validate Dart formatting across all source files
      - name: Check Code Formatting
        run: dart format --set-exit-if-changed lib/ test/

      # Execute full Unit & Widget test suite with coverage report
      - name: Execute Tests
        run: flutter test --coverage

      # Upload coverage reporting as a build artifact
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          retention-days: 7
