name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from build.gradle
      id: version
      run: |
        cd android/app
        VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' build.gradle || echo "1.0.0")
        VERSION_CODE=$(grep -oP 'versionCode \K\d+' build.gradle || echo "1")
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "✅ Version: $VERSION_NAME (code: $VERSION_CODE)"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace
      env:
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dorg.gradle.jvmargs='-Xmx2048m'"

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ APK not found! Listing outputs:"
          find android/app/build/outputs -type f 2>/dev/null || echo "No outputs found"
          exit 1
        fi
        echo "✅ APK found: $APK_PATH"
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Generate Changelog
      run: |
        echo "## Changes in v${{ steps.version.outputs.version_name }}" > changelog.md
        echo "" >> changelog.md
        echo "### 🎉 Features" >> changelog.md
        echo "- Download integration with real-time progress" >> changelog.md
        echo "- Spotify/YouTube Music web extraction" >> changelog.md
        echo "- Offline library with auto-playlist" >> changelog.md
        echo "- Streaming icon in navigation" >> changelog.md
        echo "" >> changelog.md
        echo "### 📦 Build Info" >> changelog.md
        echo "- Version: ${{ steps.version.outputs.version_name }}" >> changelog.md
        echo "- Code: ${{ steps.version.outputs.version_code }}" >> changelog.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version_name }}
        name: Pulse Player v${{ steps.version.outputs.version_name }}
        body_path: changelog.md
        files: ${{ steps.find_apk.outputs.apk_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false
