name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from build.gradle
      id: version
      run: |
        VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle || echo "1.0.0")
        VERSION_CODE=$(grep -oP 'versionCode \K\d+' android/app/build.gradle || echo "1")
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION_NAME (code: $VERSION_CODE)"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: ./android

    - name: Build Release APK
      run: ./gradlew assembleRelease
      working-directory: ./android

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version_name }}
        name: Pulse Player v${{ steps.version.outputs.version_name }}
        body: |
          ## Pulse Player v${{ steps.version.outputs.version_name }}
          
          ### 🎉 Changes in this Release
          Auto-generated release with latest changes from main branch.
          
          ### 📦 Build Info
          - Version: ${{ steps.version.outputs.version_name }}
          - Version Code: ${{ steps.version.outputs.version_code }}
          
          ### ⚠️ Legal
          - Personal offline use only
          - No DRM bypass
        files: ${{ steps.find_apk.outputs.apk_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false
