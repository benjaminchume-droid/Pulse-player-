name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from build.gradle
        id: version
        run: |
          cd android/app
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' build.gradle || echo "1.0.0")
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' build.gradle || echo "1")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION_NAME (code: $VERSION_CODE)"

  build:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.find_apk.outputs.apk_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        id: java
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        id: gradle

      - name: Decide keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✅ Using signed build"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠️ No keystore - building unsigned"
          fi

      - name: Build Signed Release
        if: steps.keystore.outputs.has_keystore == 'true'
        run: cd android && ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ secrets.KEYSTORE }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Build Release (Unsigned)
        if: steps.keystore.outputs.has_keystore == 'false'
        run: cd android && ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Generate Changelog
        id: changelog
        run: |
          echo "## Changes in v${{ needs.setup.outputs.version_name }}" > changelog.md
          echo "" >> changelog.md
          echo "### 🎉 Features" >> changelog.md
          git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD >> changelog.md 2>/dev/null || echo "- Initial release" >> changelog.md
          echo "" >> changelog.md
          echo "### 📦 Build Info" >> changelog.md
          echo "- Version: ${{ needs.setup.outputs.version_name }}" >> changelog.md
          echo "- Code: ${{ needs.setup.outputs.version_code }}" >> changelog.md
          cat changelog.md

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "✅ APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Post Setup Gradle
        if: always()
        run: echo "✅ Gradle build completed"

      - name: Post Setup JDK
        if: always()
        run: echo "✅ JDK setup completed"

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.setup.outputs.version_name }}
          name: Pulse Player v${{ needs.setup.outputs.version_name }}
          body_path: ./artifacts/changelog.md
          files: ./artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
