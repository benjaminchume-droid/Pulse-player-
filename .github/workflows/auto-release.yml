name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from build.gradle
      id: version
      run: |
        cd android/app
        VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' build.gradle || echo "1.0.0")
        VERSION_CODE=$(grep -oP 'versionCode \K\d+' build.gradle || echo "1")
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "✅ Version: $VERSION_NAME (code: $VERSION_CODE)"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build Signed Release
      if: env.KEYSTORE != null
      run: cd android && gradle assembleRelease
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Build Release (Unsigned)
      if: env.KEYSTORE == null
      run: cd android && gradle assembleRelease
      env:
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ APK not found!"
          find android/app/build/outputs -type f
          exit 1
        fi
        echo "✅ APK: $APK_PATH"
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Generate Changelog
      run: |
        cat > changelog.md << EOF
        ## Pulse Player v${{ steps.version.outputs.version_name }}
        
        ### 🎉 Features
        - Download integration with real-time progress
        - Spotify/YouTube Music web extraction
        - Offline library with auto-playlist
        - Streaming icon in navigation
        
        ### 📦 Build
        - Version: ${{ steps.version.outputs.version_name }}
        - Code: ${{ steps.version.outputs.version_code }}
        - Signed: ${{ env.KEYSTORE != null && 'Yes ✅' || 'No ⚠️' }}
        
        ### ⚠️ Legal
        - Personal offline use only
        - No DRM bypass
        EOF
        cat changelog.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version_name }}
        name: Pulse Player v${{ steps.version.outputs.version_name }}
        body_path: changelog.md
        files: ${{ steps.find_apk.outputs.apk_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false
