name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'

env:
  VERSION_NAME: "1.0.3"
  VERSION_CODE: "3"

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: ./android

    - name: Build Release APK
      run: ./gradlew assembleRelease
      working-directory: ./android

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION_NAME }}
        name: Pulse Player v${{ env.VERSION_NAME }}
        body: |
          ## Pulse Player v${{ env.VERSION_NAME }}
          
          ### 🎉 New Features
          - **Download Integration**: Download tracks from Spotify & YouTube Music
          - **Real-time Progress**: Live download progress with circular indicator
          - **Offline Library**: Auto-add downloaded tracks to library
          - **Downloaded Playlist**: Auto-generated playlist for offline tracks
          - **Streaming Icon**: Updated nav bar with AudioStream icon
          
          ### 🔧 Technical Updates
          - PlaybackViewModel: downloadState Flow + downloadTrack()
          - NowPlayingOverlay: Download button with progress
          - SettingsScreen: Spotify/YouTube login entries
          - DownloadsScreen: Shows downloaded tracks
          - MusicDao: getDownloadedSongs() query
          - Song model: isDownloaded + downloadedAt fields
          
          ### 📦 Build Info
          - Version: ${{ env.VERSION_NAME }}
          - Version Code: ${{ env.VERSION_CODE }}
          - Android SDK: 34+
          - Min SDK: 26
          
          ### ⚠️ Legal
          - Downloads for personal offline use only
          - No DRM bypass - web extraction only
          - Respect content ownership rights
        files: ${{ steps.find_apk.outputs.apk_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false
