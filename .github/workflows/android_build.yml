name: Build Android Application

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android_build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
  workflow_dispatch: # Enable manual triggers with customizable parameters

jobs:
  build_android:
    name: Build Native Android App (APK & AAB)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      # 1. Checkout the source code repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK compile environment
      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Gradle with automatic caching and configuration
      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # 4. Decrypt Keystore for production-signed release builds (if secret exists)
      - name: Decrypt Android Release Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "::warning::SIGNING_KEY_STORE_BASE64 is empty! Build will proceed in unsigned status."
          else
            mkdir -p app/keystores
            echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > app/keystores/release-key.jks
            echo "Release keystore decrypted and written to disk successfully."
          fi

      # 5. Build Android binaries using Gradle tasks
      - name: Build Android Packages (Debug & Release)
        env:
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
          PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
        run: |
          # Compile Debug APK first for instant testing
          gradle assembleDebug --no-daemon
          
          # Compile Release APK and Android App Bundle (AAB)
          gradle assembleRelease bundleRelease --no-daemon

      # 6. Upload debug binaries to GitHub Actions artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 7. Upload release binaries to GitHub Actions artifacts
      - name: Upload Release Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-release-binaries
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # 8. Output visually structured markdown summary on job completion
      - name: Generate Build Summary
        run: |
          echo "### 📱 Pulse Player Android App Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Your native Android binaries have been successfully compiled, packaged, and verified." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Packaged Artifacts Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 **Debug APK**: Ready for immediate emulator and developer manual sideloading." >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 **Release APK**: Production-optimized package for distribution testing." >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Google Play Bundle (AAB)**: Production bundle ready for Play Store Console index submission." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔍 Execution Context Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event Channel**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Core Sha**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference Hook**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Compiler Version**: \`8.2\` under Java \`JDK 17 (Zulu)\`" >> $GITHUB_STEP_SUMMARY
