name: Development Builds

on:
  push:
    branches:
      - develop
    paths:
      - 'android/**'
      - '.github/workflows/development_build.yml'
  workflow_dispatch: # Enable manual triggering with custom variables

jobs:
  build_dev_apk:
    name: Build Development Unsigned APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK required by Gradle compiler
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Gradle with automatic caching and configuration
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # 4. Build custom release APK for developer test installations
      # Note: This compiles the application in release mode but without signatures, outputting binaries
      - name: Build Unsigned Release APK
        run: gradle assembleRelease --no-daemon

      # 5. Upload Android binary artifacts to Actions dashboard
      - name: Upload Dev APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-dev-apks
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 6. Generate detailed dynamic build summary to job run screen
      - name: Generate Build Summary
        run: |
          echo "### 🚀 Native Android Development Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "The latest Pulse Player development binaries have been compiled and exported." >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit Identifier**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Target**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Storage Duration**: 14 Days" >> $GITHUB_STEP_SUMMARY
